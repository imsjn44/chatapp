name: Build and Push Docker Images

on:
  push:
    branches:
      - deploy/ecs-alb

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 830278489152.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

  # Next.js build-time variables
  NEXT_PUBLIC_USER_SERVICE: ${{ secrets.NEXT_PUBLIC_USER_SERVICE }}
  NEXT_PUBLIC_CHAT_SERVICE: ${{ secrets.NEXT_PUBLIC_CHAT_SERVICE }}

  # Service URLs
  FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
  USER_SERVICE: ${{ secrets.USER_SERVICE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::830278489152:role/githubactions-chatapp
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build images with Docker Compose
        run: docker compose build

      - name: Push images to Amazon ECR
        run: docker compose push`
